name: KVsnap no-symmetry diagnostic

on:
  workflow_dispatch:
    inputs:
      swifttla_ref:
        description: SwiftTLA branch, tag, or immutable SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: RoyalPineapple/SwiftTLA
          ref: ${{ inputs.swifttla_ref }}
          path: SwiftTLA
      - id: candidate
        name: Resolve immutable SwiftTLA revision
        run: |
          commit="$(git -C SwiftTLA rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run no-symmetry diagnostic
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/pluscal-kvsnap-no-symmetry/${{ github.run_id }}-${{ github.run_attempt }}
          TLC_TIMEOUT_SECONDS: "300"
        run: |
          ./validation/run-pluscal-oracle.sh \
            --case kvsnap-no-symmetry-diagnostic --checkout "$GITHUB_WORKSPACE/SwiftTLA" \
            --commit "${{ steps.candidate.outputs.commit }}" \
            --requested-ref "${{ inputs.swifttla_ref }}" \
            --mode candidate \
            --validation-commit "${{ github.sha }}" \
            --output "$EVIDENCE_ROOT"
      - name: Upload retained diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluscal-kvsnap-no-symmetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pluscal-kvsnap-no-symmetry/
          if-no-files-found: warn
          retention-days: 30
