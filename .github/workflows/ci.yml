name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ruby validation/test-canonicalize-tlc-dot.rb
      - run: bash validation/test-select-canonical-corpus.sh
      - run: bash validation/test-validation-checkout.sh
      - run: bash validation/test-run-pluscal-oracle-contract.sh
