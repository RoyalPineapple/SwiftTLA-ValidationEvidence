name: PlusCal candidate validation

on:
  workflow_dispatch:
    inputs:
      swifttla_ref:
        description: Candidate branch, tag, or SHA; admission requires an immutable SHA
        required: true
        type: string
      admission_mode:
        description: candidate is pre-merge evidence; admission is post-merge main evidence
        required: true
        default: candidate
        type: choice
        options: [candidate, admission]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: RoyalPineapple/SwiftTLA
          ref: ${{ inputs.swifttla_ref }}
          fetch-depth: 0
          path: SwiftTLA
      - id: candidate
        name: Resolve and verify SwiftTLA revision
        env:
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          REQUESTED_REF: ${{ inputs.swifttla_ref }}
          VALIDATION_REF: ${{ github.ref }}
        run: |
          [ "$VALIDATION_REF" = refs/heads/main ]
          commit="$(git -C SwiftTLA rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          if [ "$ADMISSION_MODE" = admission ]; then
            [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
            [ "$commit" = "$REQUESTED_REF" ]
            git -C SwiftTLA merge-base --is-ancestor "$commit" refs/remotes/origin/main
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Download source-owned canonical corpus
        env:
          ADMISSION_MODE: ${{ inputs.admission_mode }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit }}
          CORPUS_ROOT: ${{ runner.temp }}/canonical-corpus
        run: |
          set -euo pipefail
          mkdir -p "$CORPUS_ROOT"
          jq -n --arg candidateSHA "$CANDIDATE_SHA" '{candidateSHA:$candidateSHA,selection:"pending"}' > "$CORPUS_ROOT/provenance.json"
          selection="$(./validation/select-canonical-corpus.sh "$CANDIDATE_SHA" "$ADMISSION_MODE")"
          artifact_url="$(jq -r '.artifact.archiveDownloadURL' <<< "$selection")"
          artifact_digest="$(jq -r '.artifact.sha256' <<< "$selection")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq --arg candidateSHA "$CANDIDATE_SHA" \
            '. + {candidateSHA:$candidateSHA,archiveVerification:"pending"} | del(.artifact.archiveDownloadURL)' \
            <<< "$selection" \
            > "$CORPUS_ROOT/provenance.json"
          curl --fail --location --retry 3 --connect-timeout 10 \
            -H "Authorization: Bearer $GH_TOKEN" "$artifact_url" \
            -o "$CORPUS_ROOT/corpus.zip"
          archive_digest="$(shasum -a 256 "$CORPUS_ROOT/corpus.zip" | awk '{print "sha256:" $1}')"
          [ "$archive_digest" = "$artifact_digest" ]
          updated_provenance="$CORPUS_ROOT/provenance.updated.json"
          jq \
            --arg downloadedArchiveSHA256 "$archive_digest" \
            '. + {archiveVerification:"verified",downloadedArchiveSHA256:$downloadedArchiveSHA256}' \
            "$CORPUS_ROOT/provenance.json" \
            > "$updated_provenance"
          mv "$updated_provenance" "$CORPUS_ROOT/provenance.json"
          unzip -q "$CORPUS_ROOT/corpus.zip" -d "$CORPUS_ROOT/input"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17.0.19+10"
      - name: Run PlusCal evidence suite
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/pluscal-oracle/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./validation/run-pluscal-oracle.sh \
            --case all --checkout "$GITHUB_WORKSPACE/SwiftTLA" \
            --commit "${{ steps.candidate.outputs.commit }}" \
            --requested-ref "${{ inputs.swifttla_ref }}" \
            --mode "${{ inputs.admission_mode }}" \
            --validation-commit "${{ github.sha }}" \
            --canonical-corpus "${{ runner.temp }}/canonical-corpus/input" \
            --output "$EVIDENCE_ROOT"
      - name: Retain canonical corpus provenance
        if: always()
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/pluscal-oracle/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          provenance="${{ runner.temp }}/canonical-corpus/provenance.json"
          [ ! -f "$provenance" ] || cp "$provenance" "$EVIDENCE_ROOT/canonical-corpus-provenance.json"
      - name: Upload retained candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluscal-oracle-${{ steps.candidate.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pluscal-oracle/
          if-no-files-found: error
          retention-days: 30
