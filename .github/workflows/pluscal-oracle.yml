name: PlusCal candidate validation

on:
  workflow_dispatch:
    inputs:
      swifttla_ref:
        description: SwiftTLA branch, tag, or immutable SHA
        required: true
        type: string
      admission_mode:
        description: candidate is pre-merge evidence; admission is post-merge main evidence
        required: true
        default: candidate
        type: choice
        options: [candidate, admission]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: RoyalPineapple/SwiftTLA
          ref: ${{ inputs.swifttla_ref }}
          path: SwiftTLA
      - id: candidate
        name: Resolve immutable SwiftTLA revision
        run: |
          commit="$(git -C SwiftTLA rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify admission revision is main
        if: ${{ inputs.admission_mode == 'admission' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_commit="$(gh api repos/RoyalPineapple/SwiftTLA/commits/main --jq .sha)"
          [ "$main_commit" = "${{ steps.candidate.outputs.commit }}" ]
      - name: Download source-owned canonical corpus
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit }}
          CORPUS_ROOT: ${{ runner.temp }}/canonical-corpus
        run: |
          set -euo pipefail
          artifact_name="canonical-corpus-$CANDIDATE_SHA"
          artifact_url="$(gh api --paginate "/repos/RoyalPineapple/SwiftTLA/actions/artifacts?name=$artifact_name&per_page=100" | jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .archive_download_url // empty')"
          [ -n "$artifact_url" ]
          mkdir -p "$CORPUS_ROOT"
          curl --fail --location --retry 3 --connect-timeout 10 \
            -H "Authorization: Bearer $GH_TOKEN" "$artifact_url" \
            -o "$CORPUS_ROOT/corpus.zip"
          unzip -q "$CORPUS_ROOT/corpus.zip" -d "$CORPUS_ROOT/input"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run PlusCal evidence suite
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/pluscal-oracle/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./validation/run-pluscal-oracle.sh \
            --case all --checkout "$GITHUB_WORKSPACE/SwiftTLA" \
            --commit "${{ steps.candidate.outputs.commit }}" \
            --requested-ref "${{ inputs.swifttla_ref }}" \
            --mode "${{ inputs.admission_mode }}" \
            --validation-commit "${{ github.sha }}" \
            --canonical-corpus "${{ runner.temp }}/canonical-corpus/input" \
            --output "$EVIDENCE_ROOT"
      - name: Upload retained candidate evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pluscal-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pluscal-oracle/
          if-no-files-found: warn
          retention-days: 30
